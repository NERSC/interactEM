name: Codegen Check

# Fails when committed generated code (frontend/interactEM/openapi.json,
# src/client/generated/, src/types/gen.ts) does not match what `make gen`
# produces from the current backend models and pinned generator versions.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
          cache: 'npm'
          cache-dependency-path: frontend/interactEM/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/interactEM
        run: npm ci

      - name: Copy .env.example files
        run: |
          scripts/copy-dotenv.sh
          touch "$RUNNER_TEMP/nats.creds"
          echo "NATS_CREDS_FILE=$RUNNER_TEMP/nats.creds" >> "$GITHUB_ENV"

      - name: Regenerate code
        run: make gen

      - name: Check generated code is up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --stat
            git diff
            echo "::error::Generated code is out of date. Run 'make gen' and commit the result."
            exit 1
          fi
